services:
  moviebox-api:
    build: .
    container_name: moviebox-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./catalog.db:/app/catalog.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s